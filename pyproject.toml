[project]
name = "as-db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11,<4",
    "cachetools>=5,<7",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "psycopg-pool>=3.2,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "stream-zip>=0.0.83,<1",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
as-db = "as_db:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]
