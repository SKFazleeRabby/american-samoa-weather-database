services:
  agent-setup:
    profiles: ["agent"]
    image: as-db-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    command: ["python", "-m", "as_db.agent_setup"]
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      APP_DB_USER: ${APP_DB_USER:-weather_reader}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      AGENT_DB_USER: ${AGENT_DB_USER:-weather_agent}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  collector:
    image: as-db-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    command: ["python", "-m", "as_db.collection.scheduler"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SYNOPTIC_TOKEN: ${SYNOPTIC_TOKEN:-}
      HCDP_API: ${HCDP_API:-}
      COLLECTION_TIMEZONE: ${COLLECTION_TIMEZONE:-Pacific/Pago_Pago}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,datetime,pathlib; x=json.loads(pathlib.Path('/tmp/collection-health.json').read_text()); age=datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(x['last_attempt']); raise SystemExit(1 if x.get('errors') or age.total_seconds()>97200 else 0)"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 2
    depends_on:
      db:
        condition: service_healthy
      web-setup:
        condition: service_completed_successfully

  web-setup:
    image: as-db-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    command: ["python", "-m", "as_db.web.setup"]
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      APP_DB_USER: ${APP_DB_USER:-weather_reader}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env for the website}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: as-db-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      APP_DB_USER: ${APP_DB_USER:-weather_reader}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env for the website}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=7)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      web-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    entrypoint: ["/venv/bin/python3", "/pgadmin4/configure_servers.py"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_ALLOW_SAVE_PASSWORD: "False"
      PGADMIN_SERVER_JSON_FILE: /tmp/weather-servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/configure_servers.py:/pgadmin4/configure_servers.py:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
